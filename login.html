<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>TaskMind | Login</title>
    <meta
      name="description"
      content="Login to TaskMind — your AI-powered task manager."
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      .auth-wrap {
        min-height: calc(100vh - 67px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .auth-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        width: 100%;
        max-width: 420px;
        padding: 40px 36px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      }
      .auth-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 28px;
      }
      .auth-logo-icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #10b981, #059669);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 24px;
        margin-bottom: 12px;
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
      }
      .auth-title {
        font-size: 22px;
        font-weight: 800;
        text-align: center;
      }
      .auth-sub {
        font-size: 14px;
        color: var(--muted);
        text-align: center;
        margin-top: 4px;
      }
      .social-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
      }
      .btn-social {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg2);
        font-size: 14px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .btn-social:hover {
        border-color: var(--em);
        color: var(--em);
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 20px;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .auth-footer {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        margin-top: 20px;
      }
      .auth-footer a {
        color: var(--em);
        font-weight: 600;
      }
      .auth-footer a:hover {
        text-decoration: underline;
      }
      .error-box {
        display: none;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #dc2626;
        font-size: 13px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="topbar"></div>
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo"
          ><div class="logo-icon">🪄</div>
          <span>TaskMind</span></a
        >
        <div class="header-actions">
          <button class="btn-icon" id="theme-btn" onclick="toggleTheme()">
            🌙
          </button>
          <a href="signup.html" class="btn-add">Sign Up</a>
        </div>
      </div>
    </header>

    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">⚡</div>
          <div class="auth-title">Welcome Back</div>
          <div class="auth-sub">Enter the magical world of TaskMind</div>
        </div>

        <!-- Social -->
        <div class="social-row">
          <button
            class="btn-social"
            onclick="alert('Google OAuth coming soon!')"
          >
            <svg width="16" height="16" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            Google
          </button>
          <button
            class="btn-social"
            onclick="alert('GitHub OAuth coming soon!')"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
              />
            </svg>
            GitHub
          </button>
        </div>
        <div class="divider">or continue with email</div>

        <!-- Form -->
        <form onsubmit="handleLogin(event)" novalidate>
          <div id="login-error" class="error-box"></div>
          <div class="form-group">
            <label class="form-label">📧 Email Address</label>
            <input
              type="email"
              class="form-input"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="form-group">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 6px;
              "
            >
              <label class="form-label" style="margin-bottom: 0"
                >🔑 Password</label
              >
              <a href="#" style="font-size: 12px; color: var(--em)"
                >Forgot password?</a
              >
            </div>
            <div style="position: relative">
              <input
                type="password"
                class="form-input"
                id="password"
                placeholder="••••••••"
                required
                style="padding-right: 44px"
              />
              <button
                type="button"
                onclick="togglePwd()"
                style="
                  position: absolute;
                  right: 12px;
                  top: 50%;
                  transform: translateY(-50%);
                  background: none;
                  border: none;
                  cursor: pointer;
                  font-size: 16px;
                  color: var(--muted);
                "
                id="eye-btn"
              >
                👁
              </button>
            </div>
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              margin-bottom: 20px;
            "
          >
            <input
              type="checkbox"
              id="remember"
              style="accent-color: var(--em); width: 15px; height: 15px"
            />
            <label for="remember" style="font-size: 13px; color: var(--muted)"
              >Remember me for 30 days</label
            >
          </div>
          <button type="submit" class="btn-primary" id="login-btn">
            <span id="login-btn-text">Sign In</span>
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Create one →</a>
        </div>
      </div>
    </div>

    <div id="toast-stack"></div>
    <script src="app.js"></script>
    <script>
      function togglePwd() {
        const inp = document.getElementById("password");
        inp.type = inp.type === "password" ? "text" : "password";
      }
      async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const errBox = document.getElementById("login-error");
        errBox.style.display = "none";
        if (!email || !password) {
          errBox.textContent = "Please fill in all fields.";
          errBox.style.display = "block";
          return;
        }
        const btn = document.getElementById("login-btn");
        setLoading(btn, true);
        const users = getUsers();
        const user = users.find(
          (u) =>
            u.email.toLowerCase() === email.toLowerCase() &&
            u.password === password,
        );
        setLoading(btn, false);
        if (!user) {
          errBox.textContent = "Invalid email or password.";
          errBox.style.display = "block";
          return;
        }
        saveSession({
          id: user.id,
          fname: user.fname,
          lname: user.lname,
          email: user.email,
          phone: user.phone,
        });
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
